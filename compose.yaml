services:
  mqtt:
    image: eclipse-mosquitto:2
    networks: [lab]
    restart: unless-stopped
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  simulator:
    build: .
    networks: [lab]
    restart: unless-stopped
    depends_on:
      - mqtt
    environment:
      AHEAD_ALLOWED_HOSTS: "${AHEAD_ALLOWED_HOSTS:-localhost,127.0.0.1,::1}"
    command:
      - /scenario
      - --host
      - mqtt
      - --house-id
      - "${AHEAD_HOUSE_ID:-house}"
      - --console-port
      - "8765"
      - --project-store
      - /data/project.json
    volumes:
      - "${AHEAD_SCENARIO:-./scenarios/hybrid_house.toml}:/scenario:ro"
      - simulator-config:/data

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    networks: [lab]
    restart: unless-stopped
    depends_on:
      - mqtt
    volumes:
      - homeassistant-config:/config

  web:
    image: haproxy:3.2-alpine
    restart: unless-stopped
    cap_drop: [ALL]
    depends_on:
      - homeassistant
      - simulator
    networks: [web, lab]
    ports:
      - "${AHEAD_HA_PORT:-8123}:8123"
      - "${AHEAD_CONSOLE_PORT:-8765}:8765"
    volumes:
      - ./docker/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

networks:
  lab:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  web: {}

volumes:
  homeassistant-config:
  simulator-config:
