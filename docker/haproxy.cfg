defaults
    mode tcp
    timeout connect 5s
    timeout client 1h
    timeout server 1h

# Docker's embedded DNS tracks the backends when Compose recreates them.
resolvers docker
    nameserver embedded 127.0.0.11:53
    hold valid 5s

listen homeassistant
    bind :8123
    server homeassistant homeassistant:8123 resolvers docker resolve-prefer ipv4 init-addr none check

listen simulator
    bind :8765
    server simulator simulator:8765 resolvers docker resolve-prefer ipv4 init-addr none check
