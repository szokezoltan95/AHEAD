[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ahead-heating"
version = "0.1.0"
description = "Building heating control and house simulation"
readme = "README.md"
requires-python = ">=3.12"

[project.optional-dependencies]
live = ["paho-mqtt>=2.1,<3"]

[project.scripts]
ahead-sim = "ahead.simulator.__main__:main"
ahead-live = "ahead.simulator.live:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ahead.simulator" = ["console.html", "console.css", "floorplan.js", "live-view.js", "system-views.js", "example.json"]
